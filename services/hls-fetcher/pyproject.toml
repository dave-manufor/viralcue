[project]
name = "hls-fetcher"
version = "0.1.0"
description = "Fetches HLS audio streams from Twitch and sends to Deepgram"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "m3u8>=4.0.0",
    "deepgram-sdk>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlink>=6.5.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "google-cloud-pubsub>=2.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

