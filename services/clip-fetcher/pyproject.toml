[project]
name = "clip-fetcher"
version = "0.1.0"
description = "Cloud Run Job for fetching and processing viral video clips from VODs"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-storage>=2.14.0",
    "yt-dlp>=2023.11.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
