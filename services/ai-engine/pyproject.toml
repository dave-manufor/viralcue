[tool.poetry]
name = "ai-engine"
version = "0.1.0"
description = "AI engine for viral moment detection and draft generation"
authors = ["ViralCue Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.34.0"
aiobotocore = "^2.8.0"
aiohttp = "^3.9.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"
structlog = "^23.2.0"
asyncpg = "^0.29.0"
google-cloud-pubsub = "^2.23.0"
google-cloud-storage = "^2.14.0"
google-cloud-aiplatform = "^1.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
